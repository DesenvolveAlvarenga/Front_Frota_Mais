<!--
  "Conta" ainda não tem ação: a página de conta (troca de senha) entra num próximo grupo de telas.
-->
<mat-sidenav-container class="estrutura">
  <mat-sidenav class="menu-lateral" mode="side"
    [opened]="!(telaPequena$ | async)" aria-label="Menu principal">
    <div class="marca">
      <img src="imagens/logo.png" alt="Frota+" class="logo">
    </div>

    <mat-nav-list aria-label="Páginas do sistema">
      @for (item of itensMenu(); track item.rota) {
        <a mat-list-item [routerLink]="item.rota" routerLinkActive="item-ativo"
          ariaCurrentWhenActive="page">
          <span class="item-menu">
            <img [src]="item.icone" alt="" class="icone-menu">
            <span>{{ item.rotulo }}</span>
          </span>
        </a>
      }
    </mat-nav-list>

    <div class="rodape-menu-lateral">
      <button type="button" class="acao-conta" (click)="sair()">
        <img src="imagens/icon-logout.svg" alt="" width="16" height="16">
        <span>Sair</span>
      </button>
      <button type="button" class="acao-conta" aria-disabled="true"
        title="A página da conta entra no próximo grupo de telas">
        <img src="imagens/icon-usuario.svg" alt="" width="16" height="16">
        <span>Conta</span>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="area-principal">
    @if (telaPequena$ | async) {
      <header class="topo-celular">
        <button type="button" class="acao-conta" aria-disabled="true" aria-label="Conta"
          title="A página da conta entra no próximo grupo de telas">
          <img src="imagens/icon-usuario.svg" alt="" width="22" height="22">
        </button>
        <img src="imagens/logo.png" alt="Frota+" class="logo-celular">
        <button type="button" class="acao-conta" aria-label="Sair" (click)="sair()">
          <img src="imagens/icon-logout.svg" alt="" width="22" height="22">
        </button>
      </header>
    }

    <main id="conteudo" class="conteudo" tabindex="-1">
      @if (demonstracao()) {
        <p class="faixa-demonstracao" role="note">
          Modo demonstração: as telas usam dados fictícios e nada é gravado no servidor.
        </p>
      }
      <router-outlet></router-outlet>
    </main>

    @if (telaPequena$ | async) {
      <nav class="navegacao-inferior" aria-label="Páginas do sistema">
        @for (item of itensMenu(); track item.rota) {
          <a [routerLink]="item.rota" routerLinkActive="aba-ativa"
            ariaCurrentWhenActive="page" class="aba">
            <span class="icone-aba" aria-hidden="true"
              [style.mask-image]="'url(' + item.icone + ')'"
              [style.-webkit-mask-image]="'url(' + item.icone + ')'"></span>
            <span>{{ item.rotulo }}</span>
          </a>
        }
      </nav>
    }
  </mat-sidenav-content>
</mat-sidenav-container>
